name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: docker
    container:
      image: debian:bookworm
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl xz-utils ca-certificates

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Zig 0.17.0
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/zig.tar.xz \
            https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-0.17.0" >> "$FORGEJO_PATH"

      - name: Verify toolchain
        run: zig version

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tests

      - name: Test
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Upload binary
        uses: https://data.forgejo.org/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jsz-linux-x86_64
          path: zig-out/bin/
          if-no-files-found: error

  release:
    if: startsWith(forgejo.ref, 'refs/tags/v')
    needs: build
    runs-on: docker
    container:
      image: debian:bookworm
    steps:
      - name: Install release dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates

      - name: Download binary
        uses: https://data.forgejo.org/actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jsz-linux-x86_64
          path: dist/release

      - name: Publish Forgejo release
        uses: https://data.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          release-dir: dist/release
          release-notes: "Release ${{ forgejo.ref_name }}"
